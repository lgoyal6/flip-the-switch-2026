[project]
name = "contract-room"
version = "0.1.0"
description = "Resolve a breaking data change with a human and an AI agent in Switch."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4,<2", "httpx>=0.28,<1", "websockets>=15,<16"]

[project.scripts]
contract-room = "contract_room.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
