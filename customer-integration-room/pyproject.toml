[project]
name = "customer-integration-room"
version = "0.1.0"
description = "A proof-of-concept Switch workflow for resolving cross-company integration incidents."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<16"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
